// Registers the chrome://lokum/ package that lives in <install dir>/browser/lokum/
// and hands control over to LokumStartup, which wires the Turkish-delight UI
// into every browser window.
try {
  const lokumDir = Services.dirsvc.get("GreD", Ci.nsIFile);
  lokumDir.append("browser");
  lokumDir.append("lokum");
  const manifest = lokumDir.clone();
  manifest.append("chrome.manifest");

  if (manifest.exists()) {
    // Firefox only flushes its startup caches when *Firefox* changes. When a
    // Lokum update keeps the same Firefox build, compiled copies of Lokum's
    // modules could survive, so invalidate the caches whenever the Lokum
    // build identity differs from the one this profile last booted.
    try {
      const versionFile = lokumDir.clone();
      versionFile.append("version.json");
      const build = versionFile.exists()
        ? JSON.parse(Cu.readUTF8File(versionFile)).build || ""
        : "dev";
      const marker = Services.dirsvc.get("ProfD", Ci.nsIFile);
      marker.append("lokum");
      marker.append("boot-build");
      const previous = marker.exists() ? Cu.readUTF8File(marker).trim() : "";
      if (previous !== build || build === "dev") {
        Services.obs.notifyObservers(null, "startupcache-invalidate");
        if (!marker.parent.exists()) {
          marker.parent.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
        }
        const out = Cc["@mozilla.org/network/file-output-stream;1"].createInstance(
          Ci.nsIFileOutputStream
        );
        out.init(marker, 0x02 | 0x08 | 0x20, 0o644, 0);
        out.write(build, build.length);
        out.close();
      }
    } catch (ex) {
      Cu.reportError(ex);
    }

    Components.manager
      .QueryInterface(Ci.nsIComponentRegistrar)
      .autoRegister(manifest);
    ChromeUtils.importESModule(
      "chrome://lokum/content/modules/LokumStartup.sys.mjs"
    ).LokumStartup.init();
  } else {
    Cu.reportError("Lokum: chrome.manifest not found at " + manifest.path);
  }
} catch (ex) {
  Cu.reportError(ex);
}
