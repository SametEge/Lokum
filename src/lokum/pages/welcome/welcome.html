<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src chrome:; script-src chrome:; style-src chrome: 'unsafe-inline'; img-src chrome: data: moz-icon:; object-src 'none'" />
  <title>Lokum</title>
  <link rel="icon" href="chrome://lokum/content/images/lokum-icon.svg" />
  <link rel="stylesheet" href="chrome://lokum/content/pages/shared/lokum-page.css" />
  <link rel="stylesheet" href="chrome://lokum/content/pages/welcome/welcome.css" />
  <script type="module" src="chrome://lokum/content/pages/welcome/welcome.mjs"></script>
</head>
<body>
  <canvas id="sugar" aria-hidden="true"></canvas>
  <div class="lk-floaters" aria-hidden="true" id="floaters"></div>

  <header class="lk-top">
    <div class="lk-top-brand">
      <div class="lk-top-cube"><div class="lk-logo-cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <span>Lokum</span>
    </div>
    <div class="lk-top-actions">
      <label class="lk-lang-chip">
        <span id="lang-flag">🌐</span>
        <select id="lang" aria-label="Language"></select>
      </label>
      <button class="lk-skip" id="skip"></button>
    </div>
  </header>

  <main id="stage" class="lk-stage"></main>

  <footer class="lk-bottom">
    <button class="lk-button ghost" id="back"></button>
    <div class="lk-steps" id="steps" role="tablist"></div>
    <button class="lk-button primary lk-next" id="next"></button>
  </footer>
</body>
</html>
